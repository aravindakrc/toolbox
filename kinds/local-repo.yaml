kind: LocalRepo
uses:
  repo: GithubRepo
fields:
  url:
    type: string
    required: true
    sources:
      - ref: repo.cloneUrl
      - prompt: Repository clone URL
  path:
    type: string
    required: true
    sources:
      - flag: path
      - env: GITHUB_WORKSPACE
      - default: ${home}/code/${name}
  branch:
    type: string
    sources:
      - flag: branch
      - default: master
provider:
  discover: |
    test -d "$TBX_PATH/.git"
  apply: |
    git clone --branch "$TBX_BRANCH" "$TBX_URL" "$TBX_PATH"
  verify: |
    git -C "$TBX_PATH" rev-parse --is-inside-work-tree
  destroy: |
    test -d "$TBX_PATH" || exit 0
    test -z "$(git -C "$TBX_PATH" status --porcelain)" || { echo "uncommitted changes in $TBX_PATH" >&2; exit 1; }
    test -z "$(git -C "$TBX_PATH" log --branches --not --remotes --oneline)" || { echo "unpushed commits in $TBX_PATH" >&2; exit 1; }
    rm -rf "$TBX_PATH"
