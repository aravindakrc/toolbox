name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build and package
        run: |
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=tbx_${GITHUB_REF_NAME}_${os}_${arch}
            exe=tbx; [ "$os" = windows ] && exe=tbx.exe
            mkdir -p "stage/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "stage/$name/$exe" ./cmd/tbx
            cp -r kinds recipes docs "stage/$name/"
            (cd stage && zip -qr "../dist/$name.zip" "$name")
          done
          (cd dist && sha256sum *.zip > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
